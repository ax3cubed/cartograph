name = "codegen"
version = "1.1.0"
language = "ecmascript"
files = ["**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/*.ts", "**/*.tsx"]
# A generated client is read only when its banner says so. Up to 8 MiB, and only these queries.
requires = ["Generated by orval", "auto-generated by openapi-typescript", "auto generated by OpenAPI Generator", "@generated by protoc-gen"]
max_bytes = 8388608
