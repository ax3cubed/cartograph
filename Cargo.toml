# The cartograph binary and its crates (IDX-01). Benchmarks and spikes live in a separate
# workspace under bench/, so their dependencies never reach this lockfile or the shipped binary.
[workspace]
resolver = "3"
members = ["crates/*", "fixtures/gen", "eval"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ax3cubed/cartograph"
publish = false

[workspace.dependencies]
cartograph-core = { path = "crates/cartograph-core" }
cartograph-api = { path = "crates/cartograph-api" }
cartograph-discovery = { path = "crates/cartograph-discovery" }
cartograph-git = { path = "crates/cartograph-git" }
cartograph-parse = { path = "crates/cartograph-parse" }
cartograph-facts = { path = "crates/cartograph-facts" }
cartograph-store = { path = "crates/cartograph-store" }
cartograph-index = { path = "crates/cartograph-index" }
cartograph-query = { path = "crates/cartograph-query" }
cartograph-server = { path = "crates/cartograph-server" }

clap = { version = "4.6.9", features = ["derive"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Indexer (phase 1). gix without network features (B7).
gix = { version = "=0.90.0", default-features = false, features = ["max-performance", "blob-diff", "revision", "sha1", "sha256"] }
# hooks: the query layer's deadline runs in a progress handler (SRV-02).
rusqlite = { version = "=0.43.0", features = ["bundled", "hooks"] }
# Grammars compile from C in their own build.rs, at pinned versions; nothing is downloaded at run time.
tree-sitter = "=0.27.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
# IDX-23: each grammar is built in, and its parser made only when a file of that language shows up.
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-php = "=0.25.2"
# XS-18: .proto files are read with tree-sitter (no protoc, no prost): lighter than protox-parse.
tree-sitter-proto = "=0.6.1"
json-strip-comments = "=3.1.3"
# XS-23: CODEOWNERS patterns compile once into a GlobSet.
globset = "0.4.21"
rayon = "1.12.0"
# The replay's reverse index hashes ref ids by the million; already in the tree through oxc.
rustc-hash = "2.1.3"
oxc_resolver = "=11.24.3"
postcard = { version = "=1.2.0", default-features = false, features = ["use-std"] }
# Discovery (IDX-10, IDX-11): the committed cartograph.yaml and ~/.cartograph/registry.toml.
# serde_norway is a maintained fork of the archived serde_yaml on a maintained libyaml port
# (serde_yaml_ng pulls the unmaintained unsafe-libyaml, RUSTSEC-2024-0449); it bounds alias expansion.
serde_norway = "0.9.42"
toml = "1.1.8"
# SRV-21: agents install edits ~/.codex/config.toml and keeps its comments and other keys.
toml_edit = "0.25.20"

# The local server (SRV-05): axum on tokio, HTTP/1.1 only. getrandom reads the session token
# from the OS.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "sync"] }
getrandom = "0.4.3"
# SRV-06: the app's static export is brotli-compressed at build time and decompressed once at run time.
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
brotli-decompressor = "6.3.2"
# SRV-13: the event stream is a futures Stream (axum's Sse); already in the tree through axum.
futures-util = { version = "0.3.34", default-features = false }
# SRV-15: MCP over stdio on the official Rust SDK. Server and stdio only: no HTTP client, no auth,
# no network transport (F8).
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io"] }
# The server's accept loop (header-read timeout, HD-11); both already come in through axum.
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "service"] }

# XS-17: SQL in migrations and in string literals. Apache-2.0, pure Rust. No default features: the
# stack-growing recursion guard (stacker) stays out, and the parser's own recursion limit is set at
# every call. `visitor` lists the relations a statement names.
sqlparser = { version = "=0.64.0", default-features = false, features = ["std", "visitor"] }

insta = "1.49.0"
regex = "1.13.2"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
proptest = "1.12.0"
# A third-party JSON Schema validator, so the manifest schema is checked by code we didn't write.
jsonschema = { version = "0.63.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# The build script brotli-compresses the export; unoptimised that takes seconds per megabyte.
[profile.dev.package.brotli]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# panic = "abort" waits for IDX-13's crash safety.

# HD-09's performance gates: optimised like release, quicker to build.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
