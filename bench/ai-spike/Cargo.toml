[package]
name = "ai-spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "AI-01 spike: does genai, keyring and the ACP crate do what decisions G2, G3 and G4 assume? Never shipped."

[dependencies]
genai = "=0.7.5"
keyring = "=4.2.0"
agent-client-protocol = "=5.5.1"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
futures = "0.3"
serde_json = "1"
