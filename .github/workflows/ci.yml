name: CI

# Pull requests run on Linux and only the jobs whose files changed. The full Linux, macOS and Windows
# matrix runs on main, weekly, on demand, and on a PR labelled `ci:full`. Skipped jobs report as
# skipped, which branch protection treats as passing.
on:
  push:
    branches: [main]
  pull_request:
    # closed: a merged or closed PR starts a run in its own concurrency group, which cancels any run
    # still in progress for it; every job below skips on that event, so the run itself does nothing.
    types: [opened, synchronize, reopened, labeled, edited, closed]
  schedule:
    - cron: "17 6 * * 1" # Mondays: the full matrix, and fresh advisories against unchanged lockfiles
  workflow_dispatch:

# Read-only token for every job (HD-02). Release jobs get their rights per job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every action is pinned to a commit SHA (HD-01); the tag is in the comment.
jobs:
  changes:
    name: What changed
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      web: ${{ steps.f.outputs.web }}
      deps: ${{ steps.f.outputs.deps }}
      bench: ${{ steps.f.outputs.bench }}
      os: ${{ steps.f.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ponytail: a few greps instead of a paths-filter action, so no extra third-party code runs here.
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FULL_LABEL" = "true" ]; then
            full=true; files=""
          else
            full=false; files=$(git diff --name-only "$BASE"...HEAD)
          fi
          echo "$files"
          hit() { [ "$full" = true ] || printf '%s\n' "$files" | grep -qE "$1"; }
          ci='^\.github/'
          # fixtures/ and the demo data that northwind is generated from feed the Rust goldens (HD-03).
          hit "^(crates/|fixtures/|scripts/egress\.sh$|lib/workspace\.ts$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|deny\.toml$|\.gitattributes$)|$ci" && echo rust=true >> "$GITHUB_OUTPUT" || echo rust=false >> "$GITHUB_OUTPUT"
          hit "^(app/|components/|lib/|public/|scripts/|e2e/|playwright\.config\.ts$|crates/cartograph-api/|package\.json$|pnpm-(lock|workspace)\.yaml$|tsconfig\.json$|next\.config\.ts$|postcss\.config\.mjs$|\.node-version$|\.npmrc$)|$ci" && echo web=true >> "$GITHUB_OUTPUT" || echo web=false >> "$GITHUB_OUTPUT"
          hit "^(Cargo\.lock|bench/Cargo\.lock|pnpm-lock\.yaml|package\.json|deny\.toml|scripts/check-licenses\.mjs)$|$ci" && echo deps=true >> "$GITHUB_OUTPUT" || echo deps=false >> "$GITHUB_OUTPUT"
          hit "^bench/|$ci" && echo bench=true >> "$GITHUB_OUTPUT" || echo bench=false >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  conventions:
    name: Conventions
    # The branch name. Commit messages are checked by the git hooks, not here.
    # Runs on every PR, whatever changed. See CONTRIBUTING.md.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch.mjs "$HEAD_REF"

  lockfiles:
    name: One lockfile (HD-01)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Only pnpm-lock.yaml and Cargo.lock are tracked
        run: |
          if git ls-files --error-unmatch package-lock.json yarn.lock npm-shrinkwrap.json 2>/dev/null; then
            echo "::error::this project uses pnpm; remove the npm or yarn lockfile"; exit 1
          fi
          git ls-files --error-unmatch pnpm-lock.yaml Cargo.lock
      - name: npm install fails and names pnpm
        run: |
          if npm install --ignore-scripts > npm.log 2>&1; then echo "::error::npm install succeeded"; exit 1; fi
          grep -q pnpm npm.log

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.bench == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Kill loops and property cases are a sample on pull requests (about 6 minutes saved); main and
    # the full matrix run the phase 2 gate's 100 kill points, and the nightly runs 10,000 cases.
    env:
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '32' || '256' }}
      CARTOGRAPH_KILL_POINTS: ${{ github.event_name == 'pull_request' && '10' || '100' }}
      CARTOGRAPH_KILLS: ${{ github.event_name == 'pull_request' && '10' || '100' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PRs restore a warm cache without evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            bench -> target
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest builds what it tests, so there is no separate `cargo build`. Also checks the generated contract.
      # On Linux the binary's black-box suite runs in the next step instead, under the egress check.
      - run: cargo nextest run --workspace --locked --no-tests=warn ${{ runner.os == 'Linux' && '--exclude cartograph-cli' || '' }}
      # HD-11: every connect() the black-box suite (the binary, git, the tests) makes must be loopback.
      # The check first has to catch a deliberate violation, so a broken check can't pass quietly.
      - name: Black-box suite under the egress check (HD-11)
        if: runner.os == 'Linux'
        run: |
          command -v strace > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
          if scripts/egress.sh python3 -c 'import socket; socket.socket().connect_ex(("198.51.100.1", 9))'; then
            echo "::error::the egress check missed a deliberate violation"; exit 1
          fi
          cargo test --locked -p cartograph-cli --no-run
          scripts/egress.sh cargo nextest run --locked --offline -p cartograph-cli --no-tests=warn
      - run: cargo test --workspace --locked --doc
      # The phase 0 spikes stay compiling; they are a separate workspace and never ship.
      - name: Bench workspace
        if: runner.os == 'Linux' && needs.changes.outputs.bench == 'true'
        run: |
          cargo fmt --manifest-path bench/Cargo.toml --all --check
          cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path bench/Cargo.toml --locked

  # HD-09: the performance gates, on every pull request that touches Rust. Counts gate exactly; wall
  # clock gates take the best of several interleaved runs, so a noisy runner doesn't fail a PR.
  perf:
    name: Performance gates (HD-09)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Gates
        env:
          CARTOGRAPH_PERF_CSV: ${{ github.workspace }}/perf.csv
        run: cargo nextest run --locked --cargo-profile perf -p cartograph-fixtures -p cartograph-cli -E 'test(/^perf_/)' --no-tests=warn
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf
          path: perf.csv
          if-no-files-found: ignore

  web:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm check
      # HD-04: regenerated from the Rust types, not only from the checked-in schema, so a Rust field
      # change without regenerated files fails here as well as in the Rust job.
      - name: TypeScript wire types match the Rust contract (INT-01, HD-04)
        if: runner.os == 'Linux'
        run: |
          rustup show active-toolchain > /dev/null || rustup toolchain install
          cargo run --locked -q -p cartograph-api --bin gen-contract
          pnpm gen:types
          git diff --exit-code -- crates/cartograph-api/openapi.json crates/cartograph-api/schema.json lib/api/types.gen.ts
      # One production build is enough; macOS and Windows already type-check and run the checks above.
      - if: runner.os == 'Linux'
        run: pnpm build
      # FE-01: no app/api, one HTML file per route, out/ within 6 MB raw and 1.8 MB brotli.
      - if: runner.os == 'Linux'
        run: pnpm check:export

  # HD-05: the real binary on the golden fixture, driven by Playwright with every request off loopback aborted.
  # Smoke, axe and journeys run in Chromium, Firefox and WebKit on every PR. Screenshots are opt-in: they run
  # in the pinned Playwright image (scripts/e2e.mjs) on a manual run or a PR labelled `ci:visual`, since
  # pixel-exact baselines cost a Docker retake on every UI change and caught mostly host noise.
  e2e:
    name: End to end (HD-05)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Visual regression in the pinned image (opt-in)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:visual')
        run: pnpm test:e2e --visual --no-build
      # The diff images of a failed screenshot, and traces of a failed journey.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  supply-chain:
    name: Licences, advisories, SBOM (HD-12)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-audit,cargo-cyclonedx
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GPL, AGPL, PolyForm and every licence not on the allow list fail; so do git2 and forceatlas2.
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
      - run: pnpm audit --prod
      - run: node scripts/check-licenses.mjs
      # Two CycloneDX files: the binary's crates and the app's npm packages. Merging them into one
      # file per release artefact belongs to the release job (HD-13). Only main keeps them.
      - name: SBOM
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p sbom
          cargo cyclonedx --format json --spec-version 1.6 --override-filename sbom-crates
          mv crates/cartograph-cli/sbom-crates.json sbom/cartograph-crates.cdx.json
          pnpm sbom --sbom-format cyclonedx --prod > sbom/cartograph-npm.cdx.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  # The one check branch protection requires. Jobs skipped because their files didn't change count as
  # passing; any failure or cancellation fails it. (Required matrix jobs that are skipped can report
  # under an unexpanded name and never resolve, which is why main doesn't require them directly.)
  ci-passed:
    name: CI passed
    if: always() && github.event.action != 'closed'
    needs: [changes, conventions, lockfiles, rust, perf, web, e2e, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
